# Server web statis SIGM4 di server sekolah — PR-00-18, PR-08-19 (SDD-16 §4.2, SDD-INF-16 b).
#
# HANYA menyajikan hasil build web (SDD-FE-14); tidak meneruskan /api dan tidak memegang
# TLS. Routing, TLS, dan HSTS (INF-06) milik nginx sekolah, yang meneruskan `/` ke
# container ini dan `/api` langsung ke container api — satu origin bagi peramban
# (keputusan 51), sehingga `cors` tidak dipasang.

server {
    listen 80;
    server_name _;

    # Kompresi oleh server web, bukan aplikasi (SDD-06 §4.3).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Rute sisi klien jatuh ke index.html.
    location / {
        root /usr/share/sigm4/web;
        try_files $uri $uri/ /index.html =404;
    }
}
