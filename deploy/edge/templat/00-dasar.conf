# Dasar proxy tepi — PR-08-18 (SDD-INF-15). Disalin apa adanya oleh edge.sh.

# DNS internal Docker: alias `<proyek>-web` diselesaikan ulang tiap 10 detik, sehingga
# Nginx stack yang diganti deploy.sh (IP baru) tetap tercapai.
resolver 127.0.0.11 valid=10s ipv6=off;

# Host yang tidak dikenal (pemindaian IP langsung) diputus tanpa jawaban.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
