# Dependabot (SDD-SEC-11, ST-02) — PR-00-17.
#
# Pemutakhiran versi diarahkan ke `develop`, bukan cabang bawaan, agar melewati
# pipeline dan tinjauan yang sama dengan setiap perubahan lain (BRANCHING §3).
# Ekosistem github-actions memutakhirkan SHA action yang dipatok di workflows/.

version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      target-branch: develop
      schedule:
          interval: daily
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore
      groups:
          # Satu PR per jenis pemutakhiran, bukan satu PR per paket.
          minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: "/"
      target-branch: develop
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
