# SCA harian (ST-02) — PR-00-17, keputusan 45.
#
# ST-02 menuntut pemindaian dependensi HARIAN, bukan hanya saat ada PR: kerentanan
# baru terbit atas dependensi yang tidak berubah. Jadwal GitHub selalu berjalan
# pada cabang bawaan, jadi cabang integrasi dan produksi dipindai eksplisit.

name: SCA harian

on:
    schedule:
        # 20.00 UTC = 03.00 WIB, di luar jam operasional sekolah.
        - cron: "0 20 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    npm-audit:
        name: npm audit · ${{ matrix.cabang }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                cabang: [develop, main]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ matrix.cabang }}
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
            - run: npm audit --audit-level=high
