# Dependensi lingkungan PENGEMBANGAN (SDD-16 §4.8 baris Development).
# `docker compose up` menyalakan seluruhnya; `--wait` menunggu sampai tiap
# dependensi benar-benar siap, bukan sekadar containernya hidup.
#
# Berkas ini BUKAN topologi produksi. Dua perbedaan yang disengaja:
#   - PostgreSQL di sini adalah container; di produksi ia layanan TERKELOLA
#     ber-region Indonesia dan tidak pernah di-compose (SDD-INF-11).
#   - api dan worker tidak ada di sini. Keduanya dijalankan dari Dockerfile akar
#     sebagai satu image (SDD-INF-01); yang dibutuhkan pengembangan lokal adalah
#     dependensinya, bukan salinan kedua aplikasinya.
#
# RAHASIA. Nilai di bawah adalah kredensial pengembangan lokal, bukan rahasia:
# ia hanya melindungi container yang berumur sepanjang sesi kerja. Rahasia
# sungguhan tidak pernah berada di repositori — ia datang dari secret manager dan
# disuntikkan ke lingkungan proses (SEC-CFG-01, SDD-16 §4.7, §5). Karena itu tidak
# ada berkas .env di repositori ini, dan setiap nilai ditulis sebagai
# ${VAR:-bawaan} agar dapat ditimpa dari lingkungan tanpa menyunting berkas.

name: sigm4-dev

services:
  # INF-01 — PostgreSQL 15+. Versi dipatok: tstzrange + exclusion constraint
  # (CI-01) dan partial unique index adalah alasan pemilihannya, jadi mayornya
  # bukan detail yang boleh bergeser diam-diam.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigm4}
      POSTGRES_USER: ${POSTGRES_USER:-sigm4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigm4_dev}
      TZ: UTC          # INF-07, SDD-INF-09
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sigm4} -d ${POSTGRES_DB:-sigm4}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # INF-03 — Redis 7+: cache agregat dashboard, distributed lock (JOB-02),
  # rate limiting, dan antrean pekerjaan.
  redis:
    image: redis:7-alpine
    environment:
      TZ: UTC
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # INF-02 — penyimpanan objek S3-compatible. MinIO adalah bentuk swa-hosting
  # yang disebut INF-02; di produksi endpoint-nya berganti tanpa mengubah kode,
  # karena seluruh akses lewat S3_ENDPOINT (SDD-16 §4.7).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sigm4}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sigm4_dev_secret}
      TZ: UTC
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # SDD-FS-04 — ClamAV sebagai proses terpisah, dipanggil worker lewat antrean
  # setelah event FileUploaded. Bukan pustaka di dalam API.
  #
  # start_period panjang disengaja: freshclam mengunduh basis data virus pada
  # penyalaan pertama, dan itu memakan menit, bukan detik. Batas yang terlalu
  # pendek membuat `up --wait` melaporkan gagal atas container yang sebenarnya
  # sedang bekerja normal.
  clamav:
    image: clamav/clamav:1.4
    environment:
      TZ: UTC
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-db:
